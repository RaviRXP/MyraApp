name: Build Myra APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code lo
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Project files khud banao
        run: |
          mkdir -p app/src/main
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Myra"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2'
              id 'org.jetbrains.kotlin.android' version '1.9.24'
          }
          android {
              namespace 'com.myra.ai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.myra.ai"
                  minSdk 26
                  targetSdk 34
                  versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
                  versionName "1.0"
              }
              signingConfigs {
                  myra {
                      storeFile file("myra.keystore")
                      storePassword "myra1234"
                      keyAlias "myra"
                      keyPassword "myra1234"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.myra
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <application
                  android:label="Myra"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Keystore (sirf pehli baar)
        run: |
          if [ ! -f app/myra.keystore ]; then
            keytool -genkeypair -v -keystore app/myra.keystore -alias myra -keyalg RSA -keysize 2048 -validity 10000 -storepass myra1234 -keypass myra1234 -dname "CN=Myra, O=Myra, C=IN"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/myra.keystore
            git commit -m "Myra keystore [skip ci]"
            git push
          fi

      - name: APK banao
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Naam badlo
        run: cp app/build/outputs/apk/debug/app-debug.apk Myra.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Myra-APK
          path: Myra.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Myra v${{ github.run_number }}
          files: Myra.apk
